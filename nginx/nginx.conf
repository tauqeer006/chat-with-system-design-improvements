events {}

http {
    # Cache storage: 50MB of keys in memory, up to 500MB of responses on disk
    proxy_cache_path /var/cache/nginx
                     levels=1:2
                     keys_zone=edge_cache:50m
                     max_size=500m
                     inactive=60m
                     use_temp_path=off;

    # "api" is the compose service name; Docker DNS resolves it
    upstream api_upstream {
        server api:8000;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server {
        listen 80;

        # Allow bigger uploads (default is 1MB)
        client_max_body_size 20m;

        # ---- Static assets: long cache ----
        location /static/ {
            proxy_pass http://api_upstream;
            proxy_set_header Host $host;

            proxy_cache edge_cache;
            proxy_cache_methods GET HEAD;
            proxy_cache_key "$scheme$host$request_uri";   # includes ?v=hash
            proxy_cache_lock on;

            add_header X-Cache-Status $upstream_cache_status always;
        }

        # ---- Everything else (API + files) ----
        location / {
            proxy_pass http://api_upstream;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_cache edge_cache;
            proxy_cache_methods GET HEAD;                  # never cache POST/PUT/DELETE
            proxy_cache_key "$scheme$host$request_uri";    # includes query string (?v=hash)
            proxy_cache_lock on;                           # 100 misses -> 1 request to API
            proxy_cache_use_stale error timeout updating
                                  http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;              # honors stale-while-revalidate

            # Never cache requests carrying credentials
            proxy_cache_bypass $http_authorization;
            proxy_no_cache     $http_authorization;

            add_header X-Cache-Status $upstream_cache_status always;
        }
    }
}